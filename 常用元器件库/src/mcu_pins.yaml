MCU-016:
  board: 安信可 ESP32-CAM
  chip: ESP32
  five_v_tolerant: 否（所有 GPIO 不耐 5V）
  adc_range: ATTEN3 校准范围 150–2450 mV
  uart_log: UART0 U0T=GPIO1 U0R=GPIO3
  sources: [ESP-IDF 文档 api-reference/peripherals/gpio/esp32.inc（GitHub espressif/esp-idf master，GPIO 汇总表）, 乐鑫《硬件设计指南》schematic-checklist.rst Strapping Pins 与 ADC 节（GitHub espressif/esp-hardware-design-guidelines）,
    安信可 ESP32-CAM 规格书第 3 页 Internal Pin Connect（evidence/MCU-016/datasheet.pdf）]
  pins:
    GPIO12:
      header: IO12
      use: 慎用
      flags: [strap, jtag, adc2, occupied]
      adc: ADC2_CH5（开 Wi-Fi 时不能用）
      five_v_tolerant: false
      note: 启动脚（GPIO0/2/5/MTDI/MTDO），上电时外部电路不能把它拉偏；MTDI 拉高会把 Flash 电压设成 1.8V 导致不启动；TF 卡 DATA2
    GPIO13:
      header: IO13
      use: 慎用
      flags: [jtag, adc2, occupied]
      adc: ADC2_CH4（开 Wi-Fi 时不能用）
      five_v_tolerant: false
      note: TF 卡 DATA3
    GPIO15:
      header: IO15
      use: 慎用
      flags: [strap, jtag, adc2, occupied]
      adc: ADC2_CH3（开 Wi-Fi 时不能用）
      five_v_tolerant: false
      note: 启动脚（GPIO0/2/5/MTDI/MTDO），上电时外部电路不能把它拉偏；TF 卡 CMD
    GPIO14:
      header: IO14
      use: 慎用
      flags: [jtag, adc2, occupied]
      adc: ADC2_CH6（开 Wi-Fi 时不能用）
      five_v_tolerant: false
      note: TF 卡 CLK
    GPIO2:
      header: IO2
      use: 慎用
      flags: [strap, adc2, occupied]
      adc: ADC2_CH2（开 Wi-Fi 时不能用）
      five_v_tolerant: false
      note: 启动脚（GPIO0/2/5/MTDI/MTDO），上电时外部电路不能把它拉偏；TF 卡 DATA0
    GPIO4:
      header: IO4
      use: 慎用
      flags: [adc2, occupied]
      adc: ADC2_CH0（开 Wi-Fi 时不能用）
      five_v_tolerant: false
      note: 板载闪光灯（TF 卡 DATA1 也用它）
    GPIO1:
      header: U0T
      use: 慎用
      flags: [uart_log]
      five_v_tolerant: false
      note: 默认串口 TX（下载和日志）
    GPIO3:
      header: U0R
      use: 慎用
      flags: [uart_log]
      five_v_tolerant: false
      note: 默认串口 RX（下载和日志）
    GPIO0:
      header: IO0
      use: 别用
      flags: [strap, adc2, occupied]
      adc: ADC2_CH1（开 Wi-Fi 时不能用）
      five_v_tolerant: false
      note: 启动脚（GPIO0/2/5/MTDI/MTDO），上电时外部电路不能把它拉偏；摄像头 XCLK；拉低进下载
    GPIO16:
      header: IO16
      use: 别用
      flags: [psram]
      five_v_tolerant: false
      note: WROVER（带 PSRAM）模组接 PSRAM，WROOM 模组可用；模组 PSRAM 占用（IDF：GPIO16–17 常接 PSRAM）
  safe: []
