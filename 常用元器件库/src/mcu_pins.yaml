# 主控板逐脚约束表（第 5 节）。由云端一次生成，之后手工维护。
# use：能用 / 慎用 / 别用。flags：strap 启动脚、flash/psram 占用、input_only 只能输入、usb、uart_log 默认串口、
#   jtag/swd 调试口、led/button 板载、occupied 板上已占用、adc2（ESP 开 Wi-Fi 时 ADC2 不能用）、ft 耐 5V、open_drain。
# five_v_tolerant：本脚能否直接接 5V 信号。每块板的出处写在 sources。
MCU-006:
  board: 乐鑫 ESP32-DevKitC V4（38P）
  chip: ESP32
  five_v_tolerant: 否（所有 GPIO 不耐 5V）
  adc_range: ATTEN3 校准范围 150–2450 mV（硬件设计指南）
  uart_log: UART0 TX=GPIO1 RX=GPIO3
  sources: [ESP-IDF 文档 api-reference/peripherals/gpio/esp32.inc（GitHub espressif/esp-idf master，GPIO 汇总表）, 乐鑫《硬件设计指南》schematic-checklist.rst Strapping Pins 与 ADC 节（GitHub espressif/esp-hardware-design-guidelines）,
    esptool 文档 boot-mode-selection.rst（GitHub espressif/esptool）]
  pins:
    GPIO36:
      header: VP_GPIO36
      use: 慎用
      flags: [input_only]
      adc: ADC1_CH0
      five_v_tolerant: false
      note: 只能输入，无内部上下拉；开 ADC 或 Wi-Fi/蓝牙睡眠时不要用 GPIO36/39 中断（勘误 GPIO-3.11）
    GPIO39:
      header: VN_GPIO39
      use: 慎用
      flags: [input_only]
      adc: ADC1_CH3
      five_v_tolerant: false
      note: 只能输入，无内部上下拉；开 ADC 或 Wi-Fi/蓝牙睡眠时不要用 GPIO36/39 中断（勘误 GPIO-3.11）
    GPIO34:
      header: GPIO34
      use: 慎用
      flags: [input_only]
      adc: ADC1_CH6
      five_v_tolerant: false
      note: 只能输入，无内部上下拉
    GPIO35:
      header: GPIO35
      use: 慎用
      flags: [input_only]
      adc: ADC1_CH7
      five_v_tolerant: false
      note: 只能输入，无内部上下拉
    GPIO32: {header: GPIO32, use: 能用, adc: ADC1_CH4, five_v_tolerant: false}
    GPIO33: {header: GPIO33, use: 能用, adc: ADC1_CH5, five_v_tolerant: false}
    GPIO25:
      header: GPIO25
      use: 能用
      flags: [adc2]
      adc: ADC2_CH8（开 Wi-Fi 时不能用）
      five_v_tolerant: false
    GPIO26:
      header: GPIO26
      use: 能用
      flags: [adc2]
      adc: ADC2_CH9（开 Wi-Fi 时不能用）
      five_v_tolerant: false
    GPIO27:
      header: GPIO27
      use: 能用
      flags: [adc2]
      adc: ADC2_CH7（开 Wi-Fi 时不能用）
      five_v_tolerant: false
    GPIO14:
      header: GPIO14
      use: 能用
      flags: [jtag, adc2]
      adc: ADC2_CH6（开 Wi-Fi 时不能用）
      five_v_tolerant: false
    GPIO12:
      header: GPIO12
      use: 慎用
      flags: [strap, jtag, adc2]
      adc: ADC2_CH5（开 Wi-Fi 时不能用）
      five_v_tolerant: false
      note: 启动脚（GPIO0/2/5/MTDI/MTDO），上电时外部电路不能把它拉偏；MTDI 拉高会把 Flash 电压设成 1.8V 导致不启动
    GPIO13:
      header: GPIO13
      use: 能用
      flags: [jtag, adc2]
      adc: ADC2_CH4（开 Wi-Fi 时不能用）
      five_v_tolerant: false
    GPIO9:
      header: SD2_GPIO9
      use: 别用
      flags: [flash]
      five_v_tolerant: false
      note: 接模组内 SPI Flash
    GPIO10:
      header: SD3_GPIO10
      use: 别用
      flags: [flash]
      five_v_tolerant: false
      note: 接模组内 SPI Flash
    GPIO11:
      header: CMD_GPIO11
      use: 别用
      flags: [flash]
      five_v_tolerant: false
      note: 接模组内 SPI Flash
    GPIO6:
      header: CLK_GPIO6
      use: 别用
      flags: [flash]
      five_v_tolerant: false
      note: 接模组内 SPI Flash
    GPIO7:
      header: SD0_GPIO7
      use: 别用
      flags: [flash]
      five_v_tolerant: false
      note: 接模组内 SPI Flash
    GPIO8:
      header: SD1_GPIO8
      use: 别用
      flags: [flash]
      five_v_tolerant: false
      note: 接模组内 SPI Flash
    GPIO15:
      header: GPIO15
      use: 慎用
      flags: [strap, jtag, adc2]
      adc: ADC2_CH3（开 Wi-Fi 时不能用）
      five_v_tolerant: false
      note: 启动脚（GPIO0/2/5/MTDI/MTDO），上电时外部电路不能把它拉偏
    GPIO2:
      header: GPIO2
      use: 慎用
      flags: [strap, adc2]
      adc: ADC2_CH2（开 Wi-Fi 时不能用）
      five_v_tolerant: false
      note: 启动脚（GPIO0/2/5/MTDI/MTDO），上电时外部电路不能把它拉偏
    GPIO0:
      header: GPIO0
      use: 慎用
      flags: [strap, adc2, button]
      adc: ADC2_CH1（开 Wi-Fi 时不能用）
      five_v_tolerant: false
      note: 启动脚（GPIO0/2/5/MTDI/MTDO），上电时外部电路不能把它拉偏；BOOT 键
    GPIO4:
      header: GPIO4
      use: 能用
      flags: [adc2]
      adc: ADC2_CH0（开 Wi-Fi 时不能用）
      five_v_tolerant: false
    GPIO16:
      header: GPIO16
      use: 慎用
      flags: [psram]
      five_v_tolerant: false
      note: WROVER（带 PSRAM）模组接 PSRAM，WROOM 模组可用
    GPIO17:
      header: GPIO17
      use: 慎用
      flags: [psram]
      five_v_tolerant: false
      note: WROVER（带 PSRAM）模组接 PSRAM，WROOM 模组可用
    GPIO5:
      header: GPIO5
      use: 慎用
      flags: [strap]
      five_v_tolerant: false
      note: 启动脚（GPIO0/2/5/MTDI/MTDO），上电时外部电路不能把它拉偏
    GPIO18: {header: GPIO18, use: 能用, five_v_tolerant: false}
    GPIO19: {header: GPIO19, use: 能用, five_v_tolerant: false}
    GPIO21: {header: GPIO21, use: 能用, five_v_tolerant: false}
    GPIO3:
      header: RX_GPIO3
      use: 慎用
      flags: [uart_log]
      five_v_tolerant: false
      note: 默认串口 RX（下载和日志）
    GPIO1:
      header: TX_GPIO1
      use: 慎用
      flags: [uart_log]
      five_v_tolerant: false
      note: 默认串口 TX（下载和日志）
    GPIO22: {header: GPIO22, use: 能用, five_v_tolerant: false}
    GPIO23: {header: GPIO23, use: 能用, five_v_tolerant: false}
  safe: [GPIO32, GPIO33, GPIO25, GPIO26, GPIO27, GPIO14, GPIO13, GPIO4, GPIO18, GPIO19, GPIO21, GPIO22, GPIO23]
