- id: PWR-001
  category: 电源座
  name: DC-005 电源座（5.5×2.1 插头，2.0 针）
  lcsc: C381116
  alternatives: [{lcsc: C16214, note: BOOMELE DC-005，1–2 脚距 6.3（本封装 5.9），1.0 宽槽孔可容下，焊前试插}]
  key_params: 额定 5A/57V，中心针 Φ2.0，配 5.5×2.1 插头，插拔寿命 5000 次
  supply: 外部电源输入
  logic_level: 不适用
  pin_count: 3
  pinout: 1=中心针（一般接 +），2=外套（一般接 GND），3=开关脚（未插头时与 2 相通，不用可悬空）
  pitch_mm: 5.9（1–2 脚）
  row_spacing_mm: 3 脚偏离 1–2 连线 4.70
  lead_size_mm: 片状引脚，厚 0.30–0.35
  body_mm: 长 14.0 × 宽 9.0 × 高 11.0
  mount: 卧装直插，插口伸到板边
  seated_height_mm: 11.0
  kicad_symbol: Connector:Barrel_Jack_Switch
  kicad_footprint: StudentHW:PowerJack_DC-005_XKB_5A_Horizontal
  dim_source: 厂家规格书 XKB DC-005-5A-2.0 外形图与推荐 PCB 图（dim_DC005_XKB.png、dim_DC005_PCB.png）
  level: B
  pitfalls: V1.1 的 DC-005 封装插口画反，朝了板内；本封装丝印画了 EDGE 线和插口箭头，EDGE 线压在板边上
  notes: >-
    按厂家推荐 PCB 图新画：1、2 脚槽孔垂直于插头方向，3 脚槽孔平行于插头方向（立创 EDA 自带封装的槽孔方向、本体位置与厂家图不符，未采用）。
    3D 用 KiCad 官方通用 DC 座模型（BarrelJack_Horizontal，引脚布局相同，只做平移）。
  taobao_keyword: DC-005 电源座 5.5*2.1 直插 三脚
  polarized: 是
  lead_max_mm: 0.35
  check_pads: 1,2

