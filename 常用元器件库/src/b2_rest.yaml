- id: MCU-014
  category: 单片机
  name: STC89C52RC 单片机（PDIP-40，插 IC 座）
  lcsc: C14022
  datasheet_url: "https://www.stcmicro.com/STC/STC89C52RC.html"
  part_number: STC89C52RC
  manufacturer: STC（宏晶）
  alternatives: []
  alternatives_text: AT89S52（Microchip）引脚兼容，下载方式不同（ISP 而不是串口）
  key_params: 8051 内核，8KB Flash，512B RAM，32 个 I/O，串口 ISP 下载（P3.0/P3.1）
  supply: 5V 版（工作电压范围以 STC89 手册为准，云端未取到手册正文）
  logic_level: 5V TTL；P0 口开漏，需外接上拉
  pin_count: 40
  pinout: >-
    标准 8051 脚位：1–8=P1.0–P1.7，9=RST，10–17=P3.0–P3.7（10=RXD，11=TXD），18=XTAL2，19=XTAL1，20=GND，
    21–28=P2.0–P2.7，29=PSEN，30=ALE，31=EA，32–39=P0.7–P0.0，40=VCC。缺口朝左时左下为 1 脚
  pitch_mm: 2.54
  row_spacing_mm: 15.24
  lead_size_mm: 规格书只给引脚肩宽 b=1.14–1.70，没给插入段宽度（芯片插在 IC 座里，焊在板上的是座子）
  body_mm: 52.0 × 13.84（E1），排距 15.24（规格书 4.1 节 PDIP40）
  mount: 板上焊 40P IC 座（圆孔座或锁紧座），芯片插座子
  seated_height_mm: 座子 + 芯片约 8（座子型号未定）
  pin1: 1=P1.0：芯片缺口朝左、字面朝上时左下角，圆点标记；PCB 方焊盘
  kicad_symbol: MCU_Microchip_8051:AT89x51xxP
  kicad_footprint: Package_DIP:DIP-40_W15.24mm_Socket
  dim_source: STC89/90 系列技术手册 4.1 节 PDIP40 封装尺寸图（dim_STC89_PDIP40.png）：D 52.0、E 15.24、e 2.54
  level: C
  pitfalls: P0 口没有内部上拉，做 I/O 要接 10k 排阻；下载要冷启动（先点下载再上电）；40P 座子要另买并核对排距 15.24（宽体）
  notes: >-
    符号借用 AT89x51xxP（标准 8051 脚位，引脚兼容）。定 C 级的原因：手册尺寸表没给引脚插入段宽度，IC 座型号（决定孔径）还没定，
    且云端没能用接口核实 C14022 的型号、没拿到手册 PDF（只有交接线索里的尺寸图截图）。规格书缺（云端未下载，本地 fetch_evidence 补）。
  taobao_keyword: STC89C52RC 直插 DIP40
  polarized: 是
  lead_max_mm: ""
  pdf_keyword: STC89C52

