# 第二批补完（云端 2026-10-02）：Pico、Pico W、STC89C52RC、BlackPill、ESP32-CAM、LCD1602、I2C 转接板、LCD2004、
# TM1637、MAX7219、USB-TTL、ST-Link。
# 云端网络拦了立创/嘉立创接口和多数厂家站点：
#   - 有 C 编号的条目：jlc.json 用 tools/import_jlcparts.py 从 jlcparts 公开镜像写（只核型号和嘉立创库存/美元价）；
#     镜像里没有的（C14022）留给本地 fetch_evidence.py；立创商城人民币价来自交接文档 1.2 节的本地查询记录（写在 price_history.csv）。
#   - 规格书 PDF：能从 GitHub 公开仓库取到的已存（BlackPill、ESP32-CAM）；其余留给本地补。
# 等级按"实际核对过什么"定：没看到厂家引脚定义页或尺寸图的，一律 C。

- id: MCU-012
  category: 主控板
  name: 树莓派 Raspberry Pi Pico（RP2040，焊排针直插）
  lcsc: C7203002
  datasheet_url: "https://datasheets.raspberrypi.com/pico/pico-datasheet.pdf"
  part_number: Raspberry Pi Pico
  manufacturer: Raspberry Pi
  alternatives: []
  alternatives_text: Pico W（MCU-013）脚位相同；Pico H 自带排针
  key_params: RP2040 双核 Cortex-M0+ 133MHz，264KB SRAM，板载 2MB Flash，Micro-USB；26 个 GPIO（3 路 ADC）
  supply: 5V 从 VBUS（USB）或 VSYS（1.8–5.5V）进，板载 DC-DC 出 3V3
  logic_level: GPIO 3.3V，不耐 5V
  pin_count: 40
  pinout: >-
    USB 朝上看：左列自上而下 1–20 = GP0、GP1、GND、GP2–GP5、GND、GP6–GP9、GND、GP10–GP13、GND、GP14、GP15；
    右列自下而上 21–40 = GP16、GP17、GND、GP18–GP21、GND、GP22、RUN、GP26、GP27、AGND、GP28、ADC_VREF、3V3(OUT)、3V3_EN、GND、VSYS、VBUS
    （按 KiCad 官方符号 MCU_Module:RaspberryPi_Pico，与 Pico 规格书 2.1 节引脚图一致）
  pitch_mm: 2.54
  row_spacing_mm: 17.78
  lead_size_mm: 排针方针 0.64（Pico 板孔 Φ1.0）
  body_mm: 51 × 21 × 1（PCB），Micro-USB 伸出顶边 1.3
  mount: 底板焊两条 1×20 排母（或直接焊排针），Pico 焊排针后插上；USB 端朝板外
  seated_height_mm: 排母 8.5 + 板厚，约 10
  pin1: 1=GP0：USB 朝上时左列最上，PCB 圆角方焊盘
  kicad_symbol: MCU_Module:RaspberryPi_Pico
  kicad_footprint: Module:RaspberryPi_Pico_Common_THT
  dim_source: 树莓派 Pico 规格书 Figure 3（第 2 章机械规格，dim_Pico_mechanical.png）：21×51，排距 17.78，脚距 2.54，孔 Φ1.0，首末脚距 48.26
  level: B
  pitfalls: GPIO 不耐 5V，接 5V 模块要分压或电平转换；ADC 只有 GP26–28 三路；板载 LED 在 GP25（不在排针上）
  notes: >-
    KiCad 官方封装与规格书一致（排距 17.78、首末脚 48.26、孔 1.0）。环宽：焊盘 1.6、孔 1.0，环宽 0.3，2.54 脚距下按 0.3 放宽。
    C 编号与型号由 jlcparts 镜像核实；规格书 PDF 云端未能下载（datasheets.raspberrypi.com 被拦），尺寸图来自本地交接线索。
  taobao_keyword: 树莓派 Pico RP2040 官方
  polarized: 是
  lead_max_mm: 0.64
  ring_min_mm: 0.3
  pdf_keyword: Pico

