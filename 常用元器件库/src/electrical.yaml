# 电气参数（第 5 节）。由云端一次生成，之后手工维护。每条写 src_ref；查不到的值为 null 并写"未核"，不估。
# outputs：模块输出给主控的脚 → 电平（"vcc" 表示随模块供电电压；数值为固定电平；null 为未核或开漏）。
