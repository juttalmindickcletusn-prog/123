  i_peak_ma: {value: 500, cond: 按用户规范 3.3 节：ESP32 负载预算按 ≥500mA 计}
  supply_capacity_ma: {value: null, note: 板载 3.3V LDO 型号和余量未核，模块 3.3V 用电多时单独加 LDO}
