- id: DIO-001
  category: 二极管
  name: 开关二极管 1N4148（DO-35）
  lcsc: C84410
  alternatives: [{lcsc: C85057, note: 星海 1N4148 DO-35}]
  key_params: 反向耐压 100V，平均电流 200mA，反向恢复 4ns
  supply: 不适用
  logic_level: 不适用
  pin_count: 2
  pinout: 1=K（黑色环一端），2=A
  pitch_mm: 7.62
  row_spacing_mm: 不适用
  lead_size_mm: 引线 Φ0.46–0.533
  body_mm: Φ1.53–1.91 × 3.05–4.56（玻璃封装）
  mount: 卧装直插
  seated_height_mm: 约 2（贴板卧装）
  kicad_symbol: Diode:1N4148
  kicad_footprint: StudentHW:D_DO-35_SOD27_P7.62mm_Horizontal
  dim_source: 厂家规格书 onsemi DO-35 外形尺寸（dim_DO35.png）
  level: B
  pitfalls: 色环端接方焊盘（K）；用作蜂鸣器/继电器续流时 K 接电源正
  notes: 封装与 V1.1 底板 D3 同一个。
  taobao_keyword: 1N4148 直插 DO-35
  polarized: 是
  lead_max_mm: 0.533

