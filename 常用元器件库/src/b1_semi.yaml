- id: DIO-004
  category: 二极管
  name: 稳压二极管 1N4733A 5.1V 1W（DO-41）
  lcsc: C5157516
  alternatives: [{lcsc: C241985, note: Vishay 1N4733A-TAP，引线较细，同样可插 1.2 孔}]
  key_params: 稳压 5.1V（测试电流 49mA），1W，动态电阻 7Ω
  supply: 不适用
  logic_level: 不适用
