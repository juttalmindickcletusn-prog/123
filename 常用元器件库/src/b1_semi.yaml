  pinout: 1=K（色环端），2=A；稳压时 K 接正
  pitch_mm: 10.16
  row_spacing_mm: 不适用
  lead_size_mm: 引线 Φ0.8±0.15（最粗 0.95）
  body_mm: Φ2.5 × 最长 4.6（玻璃封装）
  mount: 卧装直插
  seated_height_mm: 约 2.6（贴板卧装）
  kicad_symbol: Device:D_Zener
  kicad_footprint: StudentHW:D_DO-41_SOD81_P10.16mm_Horizontal_Hole1.2
  dim_source: 厂家规格书 LGE 玻封 DO-41 外形尺寸（dim_DO41_glass.png）
