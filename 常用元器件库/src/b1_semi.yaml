  alternatives: [{lcsc: C2457, note: MDD 1N4007G}]
  key_params: 反向耐压 1000V，平均电流 1A，正向压降约 1.1V@1A
  supply: 不适用
  logic_level: 不适用
  pin_count: 2
  pinout: 1=K（色环端），2=A
  pitch_mm: 10.16
  row_spacing_mm: 不适用
  lead_size_mm: 引线 Φ0.61–0.71
  body_mm: Φ2.0–2.7 × 4.2–5.2
