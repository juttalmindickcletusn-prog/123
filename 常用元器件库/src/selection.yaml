# 按功能选型数据。tools/build_selection.py 生成 选型速查.md。
# 只写库里的编号；库外件放 not_in_lib，写"未入库"和原因。
# 每个候选件：
#   spec / spec_src   量程或精度及出处（不写就用 parts.csv 的 key_params，出处标注在其括号里）
#   difficulty 1–3 + diff_why   1 = 现成库几行代码、接线 ≤3 根；2 = I2C/SPI/串口或要注意电平；3 = 要调参、大电流或射频/协议多
#   libs   常用 Arduino 驱动库（库名在 arduino/library-registry@df95082 里核对过存在，见 build_selection.py 的 LIB_CHECKED）
#   fit    适合的场景
# 接口、供电、电平、电流从 src/electrical.yaml 读；坑从 parts.csv 的 pitfalls 读；价格、热度从市场数据读。不在这里重复写。
# avoid：很多人用但不推荐，写原因和出处（src）。

