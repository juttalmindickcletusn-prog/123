# 2026-10-02 直插化：用户只焊直插件，以下 6 条贴片件移出库（原样留档，不再参与生成和检查）

# 原在 src/b1_conn.yaml
- id: USB-002
  category: Type-C
  name: Type-C 6P 仅供电母座（贴片信号脚+直插固定脚）
  lcsc: C456012
  alternatives: []
  alternatives_text: 无已核对脚位的替代
  key_params: 只有 VBUS、GND、CC1、CC2 六个脚，额定 3A（电源脚）；CC 脚各接 5.1kΩ 下拉后，C-C 线和 PD 充电器都能出 5V
  supply: 5V 输入
  logic_level: 不适用
  pin_count: 7
  pinout: A9/B9=VBUS，A12/B12=GND，A5=CC1，B5=CC2，SH=外壳（4 个固定脚）
  pitch_mm: 1.0（A5–B5）
  row_spacing_mm: 前后固定脚相距 3.80
  lead_size_mm: 信号脚贴片；外壳固定脚厚 0.30
  body_mm: 宽 8.94 × 长 6.80 × 高 3.26
  mount: 贴片 + 直插固定脚，插口伸到板边
  seated_height_mm: 3.26
  kicad_symbol: Connector:USB_C_Receptacle_PowerOnly_6P
  kicad_footprint: StudentHW:USB_C_Receptacle_ShouHan_TYPE-C-6P_PowerOnly
  dim_source: 厂家规格书 首韩 TYPE-C 6P 推荐 PCB 图（dim_TypeC6P_layout.png，图片型，人工读图）
  level: B
  pitfalls: >-
    CC1、CC2 必须各接 5.1kΩ 到 GND，否则 C-C 线插上不供电。只有 2 个脚的 Type-C 座没有 CC 脚，已从库里删除。
    信号脚是 1.0 脚距贴片，烙铁可焊，先固定外壳脚再焊信号脚
  notes: >-
    按厂家推荐 PCB 图新画，贴片脚向后加长 0.2 方便烙铁。外壳固定脚厂家推荐焊盘 1.0×1.8，库里加大到 1.2×2.0，
    受 1.0 脚距和贴片脚间距限制，环宽按 0.3 放宽（外壳脚只做固定，不过电流）。3D 用立创 EDA 导出的模型。
  taobao_keyword: Type-C 6P 母座 贴片 带固定脚
  polarized: 否
  lead_max_mm: 0.3
  check_pads: A5,B5
  ring_min_mm: 0.3

# 原在 src/b1_conn.yaml
- id: USB-004
  category: Type-C
  name: Type-C 16P 数据母座（贴片，常用）
  lcsc: C165948
  alternatives: [{lcsc: C393939, note: 首韩 TYPE-C16PIN，与 HRO TYPE-C-31-M-12 脚位兼容（换前看规格书）}]
  key_params: USB2.0 数据 + 供电，16 个信号脚，额定 5A/20V
  supply: 5V 输入
  logic_level: D+/D- 为 USB2.0 差分信号
  pin_count: 17
  pinout: A4/A9/B4/B9=VBUS，A1/A12/B1/B12=GND，A5=CC1，B5=CC2，A6/B6=D+，A7/B7=D-，A8/B8=SBU，SH=外壳
  pitch_mm: 0.5（信号脚）
  row_spacing_mm: 不适用
  lead_size_mm: 贴片引脚宽 0.3（信号）/0.6（电源）
  body_mm: 宽 8.94 × 长 7.35 × 高 3.26
  mount: 贴片 + 直插固定脚
  seated_height_mm: 3.26
  kicad_symbol: Connector:USB_C_Receptacle_USB2.0_16P
  kicad_footprint: StudentHW:USB_C_Receptacle_HRO_TYPE-C-31-M-12
  dim_source: 厂家规格书 HRO TYPE-C-31-M-12 推荐 PCB 图（图片型 PDF，人工读图，dim_HRO_31M12_layout.png）
  level: B
  pitfalls: 0.5 mm 脚距贴片，手焊易连锡，建议嘉立创贴片；只需要供电就用 USB-002
  notes: 外壳固定脚焊盘 1.0、孔 0.6（官方封装与厂家图一致），环宽按 0.2 放宽；固定脚只做机械固定。本机官方库缺 3D 模型，库里复制一份并换上立创 EDA 的 3D，铜皮不变。
  taobao_keyword: TYPE-C-31-M-12 16P 母座
  polarized: 否
  check_pads: A6,A7
  ring_min_mm: 0.2

