power: {source: 5V 2A, capacity_ma: 2000}
mcu: MCU-004
items:
  - {id: MCU-004, qty: 1}
  - {id: SEN-014, qty: 1, vcc: 3.3, i2c_bus: 0}
  - {id: SEN-047, qty: 1, vcc: 3.3, i2c_bus: 0}
pins: {SEN-014.SDA: GPIO8, SEN-014.SCL: GPIO9, SEN-047.SDA: GPIO8, SEN-047.SCL: GPIO9}
